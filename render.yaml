services:
  - type: web
    name: longhai-securitas
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Optional: Set DATABASE_URL (e.g. free Neon / Supabase PostgreSQL connection string)
      # in Render Dashboard -> Environment to persist users, schedules & expenses permanently.
